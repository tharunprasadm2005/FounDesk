services:
  - type: web
    name: foundesk-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foundesk-db
          property: connectionString
      - key: LLM_ROUTING_STRATEGY
        value: production
      - key: APP_ENV
        value: production
      - key: LLM_DAILY_LIMIT
        value: "500"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_INTEGRATION_CLIENT_ID
        sync: false
      - key: GOOGLE_INTEGRATION_CLIENT_SECRET
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
    healthCheckPath: /api/billing/config

  - type: web
    name: foundesk-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        fromService:
          name: foundesk-backend
          type: web
          property: host
    buildFilter:
      paths:
        - frontend/**
    healthCheckPath: /

  - type: worker
    name: foundesk-scheduler
    env: docker
    dockerfilePath: ./backend/Dockerfile
    command: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foundesk-db
          property: connectionString
      - key: LLM_ROUTING_STRATEGY
        value: production
      - key: APP_ENV
        value: production
      - key: LLM_DAILY_LIMIT
        value: "500"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: foundesk-db
    databaseName: foundesk
    plan: starter
